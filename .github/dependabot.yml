version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      codeql-action:
        applies-to: version-updates
        patterns:
          - "github/codeql-action/*"
      codeql-action-security:
        applies-to: security-updates
        patterns:
          - "github/codeql-action/*"
  - package-ecosystem: npm
    directory: /npm
    schedule:
      interval: weekly
