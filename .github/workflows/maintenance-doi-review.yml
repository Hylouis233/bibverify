name: Temporary DOI review maintenance

on:
  pull_request:
    types: [opened]
    branches: [main]

permissions:
  contents: read

jobs:
  repair:
    if: >-
      github.repository == 'Hylouis233/bibverify' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'audit/doi-review-boundaries-20260905' &&
      github.event.pull_request.user.login == 'Hylouis233'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Install the repository development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Confirm the new tests expose existing regressions
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/test_doi_error_boundaries.py --junitxml=/tmp/doi-before.xml
          result=$?
          set -e
          test "$result" -eq 1
          python - <<'PY'
          import xml.etree.ElementTree as ET
          suites = ET.parse('/tmp/doi-before.xml').getroot().iter('testsuite')
          rows = list(suites)
          assert sum(int(row.get('errors', 0)) for row in rows) == 0
          assert sum(int(row.get('failures', 0)) for row in rows) >= 2
          print('Confirmed assertion failures without test-collection or setup errors.')
          PY
      - name: Apply only the two reviewed diagnostic fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(filename, old, new):
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              assert count == 1, (filename, 'expected one exact match', count)
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'src/bibverify/bibtex.py',
              '        if result.status is QueryStatus.RATE_LIMITED:\n'
              '            return self.lang.get_text("rate_limit_429", platform="Crossref")',
              '        if result.status is QueryStatus.INVALID_INPUT:\n'
              '            return self.lang.get_text("doi_invalid_input")\n'
              '        if result.status is QueryStatus.RATE_LIMITED:\n'
              '            return self.lang.get_text("crossref_rate_limit_429")',
          )
          replace_once(
              'src/bibverify/cli.py',
              '        error_console.print(checker.doi_lookup_failure_message(value, lookup))\n'
              '        if lookup.status.is_unavailable:',
              '        error_console.print(checker.doi_lookup_failure_message(value, lookup))\n'
              '        if lookup.status is QueryStatus.INVALID_INPUT:\n'
              '            raise typer.Exit(code=5)\n'
              '        if lookup.status.is_unavailable:',
          )
          replace_once(
              'src/bibverify/i18n.py',
              '        "doi_not_found": "未能通过 DOI 找到文献: {doi}",',
              '        "doi_not_found": "未能通过 DOI 找到文献: {doi}",\n'
              '        "doi_invalid_input": "DOI 输入无效：请提供非空的有效 DOI。",\n'
              '        "crossref_rate_limit_429": "Crossref 速率限制 - 请稍后降低请求频率重试；在 user_info.email 中填写有效联系邮箱，并启用 Crossref polite pool。",',
          )
          replace_once(
              'src/bibverify/i18n.py',
              '        "doi_not_found": "Could not find a reference for DOI: {doi}",',
              '        "doi_not_found": "Could not find a reference for DOI: {doi}",\n'
              '        "doi_invalid_input": "Invalid DOI input: provide a non-empty, valid DOI.",\n'
              '        "crossref_rate_limit_429": "Crossref rate limit - retry later at a lower request rate; set user_info.email to a valid contact email and enable the Crossref polite pool.",',
          )
          PY
      - name: Format only changed files
        run: >-
          python -m ruff format src/bibverify/bibtex.py src/bibverify/cli.py
          src/bibverify/i18n.py tests/test_doi_error_boundaries.py
      - name: Verify focused regressions and the complete suite
        run: |
          python -m pytest -q tests/test_doi_error_boundaries.py
          python -m ruff check src tests tools bib_check.py
          python -m ruff format --check src tests tools bib_check.py
          python -m mypy
          python -m pytest -ra
          python tools/sync_release_metadata.py --check
          python tools/validate_project.py
          git diff --check
      - name: Commit only verified changes to the isolated branch
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          expected = {
              'src/bibverify/bibtex.py', 'src/bibverify/cli.py',
              'src/bibverify/i18n.py', 'tests/test_doi_error_boundaries.py',
          }
          changed = set(subprocess.check_output(
              ['git', 'diff', '--name-only'], text=True).splitlines())
          assert changed <= expected, changed - expected
          assert {'src/bibverify/bibtex.py', 'src/bibverify/cli.py', 'src/bibverify/i18n.py'} <= changed
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/bibverify/bibtex.py src/bibverify/cli.py src/bibverify/i18n.py tests/test_doi_error_boundaries.py
          git commit -m 'fix: preserve invalid DOI input and use supported Crossref rate-limit guidance'
          git push origin HEAD:refs/heads/audit/doi-review-boundaries-20260905
