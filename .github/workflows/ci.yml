name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  channels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: npm/package-lock.json
      - name: Test npm launcher
        working-directory: npm
        run: |
          npm ci
          npm test
          npm pack --dry-run
      - name: Test Bun-only launcher
        shell: bash
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}/npm:/package:ro" \
            --workdir /tmp \
            oven/bun:1.3.3-alpine@sha256:d2bc1fbc3afcd3d70afc2bb2544235bf559caae2a3084e9abed126e233797511 \
            sh -eu -c '
              mkdir consumer
              cd consumer
              bun add /package >/dev/null
              node_path=$(command -v node)
              test "$(readlink -f "${node_path}")" = "$(readlink -f "$(command -v bun)")"
              rm -f "${node_path}"
              ! command -v node >/dev/null 2>&1
              BIBVERIFY_BINARY=/bin/true bunx --bun --no-install bibverify --version
            '
      - name: Validate Dockerfile build
        run: docker build --tag bibverify:ci .
      - name: Smoke-test container CLI
        run: docker run --rm bibverify:ci --version

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests tools bib_check.py
      - run: python -m ruff format --check src tests tools bib_check.py
      - run: python -m mypy
      - run: python -m pytest --cov=src/bibverify --cov-report=term-missing
      - run: python tools/sync_release_metadata.py --check
      - run: python tools/validate_project.py
      - run: python -m bibverify benchmark --dataset benchmarks/cases.json
      - run: python -m pip_audit . --strict

  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: python -m bibverify --version
      - run: python bib_check.py --version

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade build cyclonedx-bom twine
      - run: python -m pip install -e .
      - run: python -m build
      - run: python -m twine check dist/*
      - run: cyclonedx-py environment --output-file dist/bibverify-sbom.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/
