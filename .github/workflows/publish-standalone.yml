name: Publish standalone binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to rebuild and upload (for release recovery)
        required: false
        type: string
      target:
        description: Build one target for diagnostics, or all release targets
        required: false
        default: all
        type: choice
        options:
          - all
          - windows-x64
          - macos-x64
          - macos-arm64
          - linux-x64
          - linux-arm64

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Select build matrix
        id: matrix
        shell: bash
        env:
          TARGET: ${{ inputs.target || 'all' }}
        run: |
          case "${TARGET}" in
            all)
              MATRIX='{"include":[{"target":"windows-x64","runner":"windows-latest","python_arch":"x64"},{"target":"macos-x64","runner":"macos-15-intel","python_arch":"x64"},{"target":"macos-arm64","runner":"macos-latest","python_arch":"arm64"},{"target":"linux-x64","runner":"ubuntu-latest","python_arch":"x64"},{"target":"linux-arm64","runner":"ubuntu-24.04-arm","python_arch":"arm64"}]}'
              ;;
            windows-x64) MATRIX='{"include":[{"target":"windows-x64","runner":"windows-latest","python_arch":"x64"}]}' ;;
            macos-x64) MATRIX='{"include":[{"target":"macos-x64","runner":"macos-15-intel","python_arch":"x64"}]}' ;;
            macos-arm64) MATRIX='{"include":[{"target":"macos-arm64","runner":"macos-latest","python_arch":"arm64"}]}' ;;
            linux-x64) MATRIX='{"include":[{"target":"linux-x64","runner":"ubuntu-latest","python_arch":"x64"}]}' ;;
            linux-arm64) MATRIX='{"include":[{"target":"linux-arm64","runner":"ubuntu-24.04-arm","python_arch":"arm64"}]}' ;;
            *) echo "Unsupported target: ${TARGET}" >&2; exit 1 ;;
          esac
          echo "matrix=${MATRIX}" >> "${GITHUB_OUTPUT}"

  build:
    name: ${{ matrix.target }} standalone
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          architecture: ${{ matrix.python_arch }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - name: Build cryptography with static OpenSSL on macOS Intel
        if: matrix.target == 'macos-x64'
        shell: bash
        run: |
          export OPENSSL_DIR="$(brew --prefix openssl@3)"
          export OPENSSL_STATIC=1
          python -m pip install --no-cache-dir --no-binary cryptography cryptography
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: python -m bibverify benchmark
      - run: python tools/sync_release_metadata.py --check
      - run: python tools/validate_project.py
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        shell: bash
        run: test "${RELEASE_TAG}" = "v$(python -c 'from bibverify import __version__; print(__version__)')"
      - name: Build native executable
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile
          --name bibverify --paths src --distpath dist-standalone
          --workpath build/pyinstaller --specpath build/pyinstaller
          --collect-all mcp --collect-data bibverify src/bibverify/__main__.py
      - name: Smoke-test and package
        run: python tools/package_standalone.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: standalone-${{ matrix.target }}
          path: release/*

  windows-arm64-emulation:
    name: windows-arm64 x64 compatibility
    if: >-
      always() && needs.build.result != 'cancelled' &&
      (inputs.target == '' || inputs.target == 'all' || inputs.target == 'windows-x64')
    needs: build
    runs-on: windows-11-arm
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: standalone-windows-x64
          path: release
      - name: Smoke-test x64 executable under Windows Arm emulation
        shell: pwsh
        run: |
          $executable = Get-ChildItem release -Filter "bibverify-*-windows-x64.exe" | Select-Object -First 1
          if (-not $executable) { throw "Windows x64 release executable was not downloaded." }
          & $executable.FullName --version

  release:
    if: >-
      (startsWith(github.ref, 'refs/tags/') || inputs.release_tag != '') &&
      (inputs.target == '' || inputs.target == 'all')
    needs: [build, windows-arm64-emulation]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: standalone-*
          path: release
          merge-multiple: true
      - name: Generate checksums and channel manifests
        shell: bash
        run: |
          find release -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum | sed 's#release/##' > release/SHA256SUMS
          python tools/generate_channel_metadata.py --release-dir release --output-dir release/channels
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          gh release view "${RELEASE_TAG}" --repo "${GH_REPO}" >/dev/null 2>&1 || \
            gh release create "${RELEASE_TAG}" --repo "${GH_REPO}" --verify-tag --generate-notes
          gh release upload "${RELEASE_TAG}" \
            $(find release -type f -print) \
            --repo "${GH_REPO}" --clobber
