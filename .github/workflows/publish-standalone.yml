name: Publish standalone binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to rebuild and upload (for release recovery)
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }} standalone
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: python -m bibverify benchmark
      - run: python tools/sync_release_metadata.py --check
      - run: python tools/validate_project.py
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        shell: bash
        run: test "${RELEASE_TAG}" = "v$(python -c 'from bibverify import __version__; print(__version__)')"
      - name: Build native executable
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile
          --name bibverify --paths src --distpath dist-standalone
          --workpath build/pyinstaller --specpath build/pyinstaller
          --collect-all mcp --collect-data bibverify src/bibverify/__main__.py
      - name: Smoke-test and package
        run: python tools/package_standalone.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: standalone-${{ runner.os }}-${{ runner.arch }}
          path: release/*

  release:
    if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: standalone-*
          path: release
          merge-multiple: true
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          gh release view "${RELEASE_TAG}" --repo "${GH_REPO}" >/dev/null 2>&1 || \
            gh release create "${RELEASE_TAG}" --repo "${GH_REPO}" --verify-tag --generate-notes
          gh release upload "${RELEASE_TAG}" release/* --repo "${GH_REPO}" --clobber
