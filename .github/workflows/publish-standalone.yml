name: Publish standalone binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }} standalone
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - name: Build native executable
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile
          --name bibverify --paths src --distpath dist-standalone
          --workpath build/pyinstaller --specpath build/pyinstaller
          --collect-all mcp src/bibverify/__main__.py
      - name: Smoke-test and package
        run: python tools/package_standalone.py
      - uses: actions/upload-artifact@v6
        with:
          name: standalone-${{ runner.os }}-${{ runner.arch }}
          path: release/*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: standalone-*
          path: release
          merge-multiple: true
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" release/* --clobber
