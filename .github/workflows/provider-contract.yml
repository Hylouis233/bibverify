name: Provider contract smoke tests

on:
  schedule:
    - cron: "17 3 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Verify stable public identifiers
        env:
          BIBVERIFY_EMAIL: contract-test@example.com
          BIBVERIFY_LIVE_TESTS: "1"
        run: python -m pytest tests/test_live_contract.py -m live --junitxml=provider-contract.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: provider-contract-results
          path: provider-contract.xml
