name: Provider contract smoke tests

on:
  schedule:
    - cron: "17 3 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Verify stable public identifiers
        env:
          BIBVERIFY_EMAIL: contract-test@example.com
          BIBVERIFY_LIVE_TESTS: "1"
        run: python -m pytest tests/test_live_contract.py -m live -rs --junitxml=provider-contract.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: provider-contract-results
          path: provider-contract.xml
